name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: HTTP server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, binary: target/debug/recern-vector-server }
          - { os: macos-latest, binary: target/debug/recern-vector-server }
          - { os: windows-latest, binary: target/debug/recern-vector-server.exe }
    runs-on: ${{ matrix.os }}
    env:
      RECERN_TEST_SERVER_BIN: ${{ github.workspace }}/${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --locked -p recern-vector-server
      - run: cargo test --locked -p recern-vector-client
      - name: Install bindings and contract test tools
        shell: bash
        run: |
          python -m pip install "maturin>=1.9,<2" pytest numpy -r api/requirements.txt
          python -m maturin build --release --manifest-path crates/recern-vector-py/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist recern-vector
      - run: python -m pytest api/tests -q

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --release --example quickstart

  python:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: [6333:6333]
        env:
          QDRANT__TELEMETRY_DISABLED: "true"
          QDRANT__SERVICE__API_KEY: recern-vector-tests-local-only
    env:
      RECERN_TEST_QDRANT_URL: http://127.0.0.1:6333
      RECERN_TEST_QDRANT_API_KEY: recern-vector-tests-local-only
      RECERN_QDRANT_API_KEY: recern-vector-tests-local-only
      RECERN_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/recern-vector-server
      RECERN_TEST_CLIENT_BIN: ${{ github.workspace }}/target/debug/examples/portable
      RECERN_TEST_NODE_PORTABLE: ${{ github.workspace }}/crates/recern-vector-node/portable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build server and portable Rust client
        run: |
          cargo build --locked -p recern-vector-server
          cargo test --locked -p recern-vector-client
          cargo build --locked -p recern-vector-client --example portable
      - name: Build and test the bindings
        working-directory: crates/recern-vector-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.9,<2" pytest numpy
          pip install -r ../../api/requirements.txt
          maturin develop --release
          pytest
          python -m pytest ../../api/tests -q --ignore=../../api/tests/test_sdk_interop.py
          python ../../examples/python/quickstart.py
          python ../../examples/python/inspect_and_tune.py
          python ../../examples/python/portable.py --path "$RUNNER_TEMP/portable.rvec"
          python ../../examples/python/portable.py --qdrant "$RECERN_TEST_QDRANT_URL" --namespace ci_example
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Python, Node and CLI interoperability
        run: |
          node api/tests/wire-roundtrip.mjs
          cargo build --release -p recern-vector-cli
          npm run build --prefix crates/recern-vector-node
          npm test --prefix crates/recern-vector-node
          crates/recern-vector-py/.venv/bin/python tests/interop.py
          crates/recern-vector-py/.venv/bin/python -m pytest api/tests/test_sdk_interop.py -q
          node tests/node-package.cjs

  cli-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p recern-vector-cli
      - run: PATH="$PWD/target/release:$PATH" examples/cli/quickstart.sh

  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RECERN_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/recern-vector-server${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked -p recern-vector-server
      - run: npm run build
        working-directory: crates/recern-vector-node
      - run: npm test
        working-directory: crates/recern-vector-node
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ runner.os }}-${{ runner.arch }}
          path: |
            crates/recern-vector-node/*.node
            crates/recern-vector-node/index.js
            crates/recern-vector-node/index.d.ts
            crates/recern-vector-node/portable/
            crates/recern-vector-node/package.json
            crates/recern-vector-node/README.md
            crates/recern-vector-node/LICENSE-*
