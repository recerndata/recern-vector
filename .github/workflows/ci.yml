name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --release --example quickstart

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the bindings
        working-directory: crates/recern-vector-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.9,<2" pytest numpy
          maturin develop --release
          pytest
          python ../../examples/python/quickstart.py
          python ../../examples/python/inspect_and_tune.py

  cli-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p recern-vector-cli
      - run: PATH="$PWD/target/release:$PATH" examples/cli/quickstart.sh
