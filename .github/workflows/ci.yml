name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --release --example quickstart

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the bindings
        working-directory: crates/recern-vector-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.9,<2" pytest numpy
          maturin develop --release
          pytest
          python ../../examples/python/quickstart.py
          python ../../examples/python/inspect_and_tune.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Python, Node and CLI interoperability
        run: |
          cargo build --release -p recern-vector-cli
          npm run build --prefix crates/recern-vector-node
          crates/recern-vector-py/.venv/bin/python tests/interop.py

  cli-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p recern-vector-cli
      - run: PATH="$PWD/target/release:$PATH" examples/cli/quickstart.sh

  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
        working-directory: crates/recern-vector-node
      - run: npm test
        working-directory: crates/recern-vector-node
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ runner.os }}-${{ runner.arch }}
          path: |
            crates/recern-vector-node/*.node
            crates/recern-vector-node/index.js
            crates/recern-vector-node/index.d.ts
            crates/recern-vector-node/package.json
            crates/recern-vector-node/README.md
            crates/recern-vector-node/LICENSE-*
