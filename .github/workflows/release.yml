name: Release diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tls:
    runs-on: macos-14
    env:
      RECERN_TEST_SERVER_BIN: ${{ github.workspace }}/installed-native/bin/recern-vector-server
      RECERN_TEST_CLIENT_BIN: ${{ github.workspace }}/test-tools/portable
      RECERN_TEST_NODE_PORTABLE: ${{ github.workspace }}/installed-node/node_modules/@recern/vector/portable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wheel-macos-14-aarch64
          run-id: 40875337291
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          run-id: 40875337291
          github-token: ${{ github.token }}
          path: native-dist
      - uses: actions/download-artifact@v4
        with:
          name: test-tools-darwin-arm64
          run-id: 40875337291
          github-token: ${{ github.token }}
          path: test-tools
      - name: Install and diagnose the built packages
        shell: bash
        run: |
          mkdir installed-native
          tar -xzf native-dist/recern-vector-0.4.0-darwin-arm64.tar.gz --strip-components=1 -C installed-native
          chmod +x test-tools/* installed-native/bin/*
          npm install --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_WORKSPACE/installed-node" "$GITHUB_WORKSPACE/native-dist/recern-vector-0.4.0-node-darwin-arm64.tgz"
          python -m pip install pytest numpy -r api/requirements.txt
          python -m pip install --no-index --find-links dist recern-vector
          python - <<'PY'
          import http.client,ssl,socket,pytest
          from pathlib import Path
          print('SSL',ssl.OPENSSL_VERSION,flush=True)
          print('localhost addresses',socket.getaddrinfo('localhost',443),flush=True)
          original=http.client.HTTPSConnection.connect
          def trace(self):
            try:return original(self)
            except Exception as e:
              print('TLS CONNECT:',type(e).__name__,str(e),flush=True);raise
          http.client.HTTPSConnection.connect=trace
          target='api/tests/test_sdk_interop.py::test_private_ca_is_verified_by_all_clients'
          result=pytest.main([target,'-s','-q','--tb=short'])
          print('LOCALHOST RESULT',result,flush=True)
          p=Path('api/tests/test_sdk_interop.py');p.write_text(p.read_text().replace('url=f"https://localhost:', 'url=f"https://127.0.0.1:'))
          result2=pytest.main([target,'-s','-q','--tb=short'])
          print('IPV4 RESULT',result2,flush=True)
          PY
