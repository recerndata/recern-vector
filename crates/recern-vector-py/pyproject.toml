[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "recern-vector"
description = "A single-file, embedded, inspectable vector database"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://recern.net/vector"
Repository = "https://github.com/recerndata/recern-vector"
Benchmarks = "https://recern.net/vector/benchmarks"

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]

[tool.maturin]
python-source = "python"
module-name = "recern_vector._native"
