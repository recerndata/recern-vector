[package]
name = "recern-vector-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
recern-vector.workspace = true
recern-vector-client = { path = "../recern-vector-client" }
serde_json.workspace = true
serde = "1"
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
[build-dependencies]
napi-build = "2"
